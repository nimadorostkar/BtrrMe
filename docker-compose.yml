version: '3'

services:
  redis:
    container_name: redis
    image: redis:7.0
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      main:

  backend:
    container_name: backend
    build: ./
    command: sh -c "python manage.py makemigrations &&
      python manage.py migrate &&
      python manage.py collectstatic --no-input &&
      gunicorn --bind 0.0.0.0:8000 --workers=4 --log-level=debug --capture-output --chdir=/btrrme config.wsgi:application"
    ports:
      - "8000:8000"
    volumes:
      - .:/btrrme
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      main:

networks:
  main:

volumes:
  redis-data:
    driver: local
